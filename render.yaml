services:
  - type: web
    name: caresync-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run typecheck && npm test && npm run build && npm run prisma:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_DISABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: caresync-rate-limit
          property: connectionString
  - type: keyvalue
    name: caresync-rate-limit
    plan: free
    region: singapore
    ipAllowList: []
